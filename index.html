<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Continue in the app</title>
<style>
  :root {
    --bg: #f4f5f8; --card: rgba(255,255,255,0.86); --border: rgba(15,18,28,0.08);
    --text: #12141a; --text-2: #5b616d; --ink: #12141a; --on-ink: #fff; --ok: #1f9d74; --bad: #d93b40;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1017; --card: rgba(26,28,36,0.88); --border: rgba(255,255,255,0.08);
      --text: #eceef3; --text-2: #9aa1ad; --ink: #f4f5f8; --on-ink: #0d1017; --ok: #34c3a0; --bad: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px;
    background: radial-gradient(1200px 600px at 20% 0%, color-mix(in srgb, var(--ok) 10%, transparent), transparent 60%), var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(400px, 100%); padding: 32px 28px 26px; border-radius: 18px; text-align: center;
    background: var(--card); border: 0.5px solid var(--border);
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.35); backdrop-filter: blur(20px);
  }
  .glyph {
    width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 14px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--state) 14%, transparent); color: var(--state);
  }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; }
  p { margin: 0; color: var(--text-2); font-size: 14px; }
  .btn {
    display: block; width: 100%; margin-top: 22px; padding: 11px 16px; border-radius: 10px; border: 0;
    background: var(--ink); color: var(--on-ink); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .btn:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  .note { margin-top: 16px; font-size: 12.5px; line-height: 1.55; }
  .hidden { display: none; }
</style>
</head>
<body>
<main class="card" id="card" style="--state: var(--ok)">
  <div class="glyph" aria-hidden="true">
    <svg id="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <h1 id="title">Email confirmed</h1>
  <p id="body">You’re all set. Go back to the app to finish signing in.</p>
  <a class="btn hidden" id="open" href="#">Open the app</a>
  <p class="note" id="note">Reading this on another device? Just log in on your computer — your email is already confirmed.</p>
</main>
<script>
  (function () {
    // Supabase puts the result in the fragment: #access_token=…&type=signup, or #error=…
    var hash = location.hash.replace(/^#/, '');
    var params = new URLSearchParams(hash);
    var to = new URLSearchParams(location.search).get('to') === 'reset' ? 'reset' : 'confirm';
    // Don't leave the session in the address bar or history; keep it only for the button.
    if (hash) history.replaceState(null, '', location.pathname + location.search);

    var $ = function (id) { return document.getElementById(id); };
    var error = params.get('error_description') || params.get('error');

    if (error) {
      $('card').style.setProperty('--state', 'var(--bad)');
      $('icon').innerHTML = '<path d="M18 6 6 18M6 6l12 12"/>';
      var expired = /expired|invalid/i.test(error) || params.get('error_code') === 'otp_expired';
      $('title').textContent = expired ? 'This link has expired' : 'That didn’t work';
      $('body').textContent = expired
        ? 'Links work once and expire after an hour. Open the app and send a new one.'
        : error.replace(/\+/g, ' ');
      $('note').textContent = 'If you already confirmed, just log in.';
      return;
    }

    if (!params.get('access_token')) {
      $('title').textContent = 'Open the link from your email';
      $('body').textContent = 'This page finishes a sign-in step that starts from an emailed link.';
      $('note').classList.add('hidden');
      return;
    }

    if (to === 'reset') {
      $('title').textContent = 'Choose a new password';
      $('body').textContent = 'Continue in the app on this computer. You’ll need your recovery key.';
      $('note').textContent = 'On another device? Open the reset email on the computer where the app is installed.';
    }
    var open = $('open');
    open.href = 'notesharingapp://auth/' + to + '#' + hash;
    open.classList.remove('hidden');
  })();
</script>
</body>
</html>
